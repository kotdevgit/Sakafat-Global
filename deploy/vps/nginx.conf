# ==============================================================================
# Sakafat Global — Nginx Production Reverse Proxy Configuration
# ==============================================================================
# Place at /etc/nginx/sites-available/sakafat
# Enable: sudo ln -s /etc/nginx/sites-available/sakafat /etc/nginx/sites-enabled/
# Test:   sudo nginx -t
# Reload: sudo systemctl reload nginx
# ==============================================================================

# HTTP to HTTPS Redirection
server {
    listen 80;
    listen [::]:80;
    server_name sakafat.com www.sakafat.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Production HTTPS Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sakafat.com www.sakafat.com;

    # SSL Certificates (managed by Certbot / Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/sakafat.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sakafat.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Maximum file upload size (for attachments and artwork)
    client_max_body_size 25M;

    # 1. Django Admin Direct Access
    location /admin/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90;
    }

    # 2. Django Uploaded Media Files (Artwork, Audio, Attachments)
    location /media/ {
        alias /var/www/sakafat/backend/saqaft/media/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # 3. Django Static Files (Unfold Admin styling and scripts)
    location /django-static/ {
        alias /var/www/sakafat/backend/saqaft/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # 4. Next.js Frontend (Serves all pages, static assets, and /api BFF routes)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
